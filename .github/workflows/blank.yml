name: repo test
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Run repo
        env:
          PASS_A: ${{ secrets.SECRET_A }}
          KEY_B: ${{ secrets.SECRET_B }}
        run: |
          $cmd = ''
          powershell.exe -NoProfile -NonInteractive -EncodedCommand $cmd
